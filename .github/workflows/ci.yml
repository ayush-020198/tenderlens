name: Optional hosted checks (free allowance required)

on:
  workflow_dispatch:
    inputs:
      free_allowance_confirmed:
        description: "I confirmed available free Actions allowance and a no-spend safeguard."
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: tenderlens-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: inputs.free_allowance_confirmed && vars.FREE_CI_CONFIRMED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci && npm --prefix frontend ci
      - run: npm run check && npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
