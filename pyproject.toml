[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tenderlens-india"
version = "0.1.0"
description = "Evidence-first reading of Indian tender packages with local retrieval and Gemma."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "pdfplumber>=0.11,<1",
  "pypdfium2>=4.30,<6",
  "pytesseract>=0.3.13,<1",
  "pillow>=11,<13",
  "rank-bm25>=0.2.2,<1",
  "numpy>=2,<3",
  "reportlab>=4.3,<5",
]

[project.optional-dependencies]
retrieval = ["fastembed>=0.7,<1"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["backend/tenderlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
